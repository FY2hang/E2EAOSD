# backbone:
#   # [from, module, args]
#   - [-1, StemBlock, [16, 16, True]] # 0-P2/4
#   - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
#   - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
#   - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16

# encoder:
#   - [1, ConvNormLayer_fuse, [256, 1, 1]] # 4-P2/4
#   - [2, ConvNormLayer_fuse, [256, 1, 1]] # 5-P3/8
#   - [3, ConvNormLayer_fuse, [256, 1, 1]] # 6-P4/16

#   - [-1, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 7-P4/16

#   - [[7, 5, 4], BDBlock, [[3, 5, 7, 9]]] # 8-P3/8
#   - [-1, ConvNormLayer_fuse, [256, 3, 2]] # 9-P4/16
#   - [8, nn.Upsample, [None, 2, "nearest"]] # 10-P2/4

#   - [[9, 7], Concat, []] # 11-P4/16
#   - [-1, Faster_Block, [256]] # 12-P4/16

#   - [[10, 4], Concat, []] # 13-P2/4
#   - [-1, Faster_Block, [128]] # 14-P2/4

#   - [[12, 8, 14], BDBlock, [[3, 5, 7, 9]]] # 15-P3/8
#   - [-1, ConvNormLayer_fuse, [256, 3, 2]] # 16-P4/16
#   # - [15, nn.Upsample, [None, 2, "nearest"]] # 17-P2/4

#   - [[16, 12], Concat, []] # 17-P4/16
#   - [-1, Faster_Block, [256]] # 18-P4/16

#   # - [[17, 14], Concat, []] # 20-P2/4
#   # - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 21-P2/4

# decoder:
#   - [[15, 18], DFINETransformer, {"feat_strides":[8, 16], "hidden_dim": 256, "num_levels": 2, "num_layers": 3, "num_points": [3, 6], "dim_feedforward": 1024}]



backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16

encoder:
  - [1, ConvNormLayer_fuse, [256, 1, 1]] # 4-P2/4
  - [2, ConvNormLayer_fuse, [256, 1, 1]] # 5-P3/8
  - [3, ConvNormLayer_fuse, [256, 1, 1]] # 6-P4/16

  - [-1, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 7-P4/16

  - [[7, 5, 4], BDBlock, [[3, 5, 7, 9]]] # 8-P3/8
  - [-1, ConvNormLayer_fuse, [256, 3, 2]] # 9-P4/16

  - [[9, 7], Concat, []] # 10-P4/16
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 11-P4/16

decoder:
  - [[8, 11], DFINETransformer, {"feat_strides":[8, 16], "hidden_dim": 256, "num_levels": 2, "num_layers": 3, "num_points": [3, 6], "dim_feedforward": 1024}]