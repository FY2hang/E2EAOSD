# decoder:
#   - [[17, 20], DFINETransformer, {"feat_strides":[8, 16], "hidden_dim": 256, "num_levels": 2, "num_layers": 3, "num_points": [6, 6], "dim_feedforward": 1024}]


backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16
  - [-1, HG_Stage, [64, 512, 1, 3, False, True, 5, True, 'se']] # 4-P4/16

# 640x640x3
# 320x320x64

encoder:
  - [1, ConvNormLayer_fuse, [128, 1, 1]] # 5-P2/4
  - [2, ConvNormLayer_fuse, [128, 1, 1]] # 6-P3/8
  - [4, ConvNormLayer_fuse, [256, 1, 1]] # 7-P4/16

  - [-1, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 8-P4/16
  # - [-1, MetaFormer_Mona, [256, {'module': AdaptiveSparseSA, 'param':{'num_heads': 8, 'sparseAtt': True}}, {'module': ConvolutionalGLU, 'param': {'act_layer': nn.GELU, 'drop': 0.0}}, {'selfatt': True}]] # 7-P5/32
  # - [-1, NCHW2NLC2NCHW, [{'module': PolaLinearAttention, 'param':{'num_heads': 8, 'hw': [20, 20]}}]] # 7-P5/32

  - [-1, ConvNormLayer_fuse, [128, 1, 1]] # 9
  # - [-1, nn.Upsample, [None, 2, "nearest"]] # 10
  # - [[-1, 6], Concat, []] # 11-P3/8
  - [[6, -1], SCEF, [128]] # 10
  - [-1, RepNCSPELAN4, [128, 256, 21, 2, False, 'silu']] # 11-P3/8
  
  - [-1, ConvNormLayer_fuse, [128, 1, 1]] # 12
  # - [-1, nn.Upsample, [None, 2, "nearest"]] # 14
  # - [[-1, 5], Concat, []] # 15-P2/4
  - [[5, -1], SCEF, [128]] # 13
  - [-1, RepNCSPELAN4, [128, 64, 21, 2, False, 'silu']] # 14-P2/4

  # - [-1, SCDown, [128, 3, 2, 'silu']] # 15-P3/8
  # - [[-1, 12], Concat, []] # 16-P3/8
  - [[12, -1], SCEF, [128]] # 15
  - [-1, RepNCSPELAN4, [128, 128, 21, 2, False, 'silu']] # 17-P3/8

  # - [-1, SCDown, [256, 3, 2, 'silu']] # 20-P4/16
  # - [[-1, 9], Concat, []] # 21-P4/16
  - [[9, -1], SCEF, [256]] # 17
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']] # 20-P4/16

decoder:
  - [[16, 18], DFINETransformer, {"feat_strides":[8, 16], "hidden_dim": 256, "num_levels": 2, "num_layers": 3, "num_points": [6, 6], "dim_feedforward": 1024}]