# backbone:
#   # [from, module, args]
#   - [-1, StemBlock, [16, 16, True]] # 0-P2/4
#   - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
#   - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
#   - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16

# encoder:
#   - [2, ConvNormLayer_fuse, [128, 1, 1]] # 4-P3
#   - [3, ConvNormLayer_fuse, [128, 1, 1]] # 5-P4

#   - [-1, TransformerEncoderBlock, [8, 512, 0.1, "relu", 10000, False]] # 6-P4

#   - [-1, ConvNormLayer_fuse, [128, 1, 1]] # 7
#   # - [-1, nn.Upsample, [None, 2, "nearest"]] # 8
#   # - [[-1, 4], Concat, []] # 9-P3/8
#   # - [-1, RepNCSPELAN4, [128, 256, 21, 2, False, 'silu']] # 10-P3/8

#   # - [-1, SCDown, [128, 3, 2, 'silu']] # 11-P4/16
#   - [[-1, 7], Concat, []] # 12-P4/16
#   - [-1, RepNCSPELAN4, [128, 256, 21, 2, False, 'silu']] # 13-P4/16

# decoder:
#   - [[9], DFINETransformer, {"feat_strides":[16], "hidden_dim": 128, "num_levels": 1, "num_layers": 3, "num_points": [6], "dim_feedforward": 512}]


backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16

encoder:
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 4
  - [[-1, 2], Concat, []] # 5-P3  /8
  - [-1, Faster_Block, [128, 8, 1.5, 0.05, 0.0, 'split_cat']]

  - [-1, nn.Upsample, [None, 2, "nearest"]] # 7
  - [[-1, 1], Concat, []] # 8-P2 /4
  - [[-1, Faster_Block, [128, 8, 1.5, 0.05, 0.0, 'split_cat']]]

  - [-1, SCDown, [128, 3, 2, 'silu']] # 10-P3
  - [[-1, 6], Concat, []] # 11-P3 /8
  - [-1, Faster_Block, [128, 8, 1.5, 0.05, 0.0, 'split_cat']]

  - [-1, SCDown, [128, 3, 2, 'silu']] # 13-P4
  - [[-1, 3], Concat, []] # 14-P4 /16
  - [-1, Faster_Block, [128, 8, 1.5, 0.05, 0.0, 'split_cat']]

decoder:
  - [[15], DFINETransformer, {"feat_strides":[16], "hidden_dim": 128, "num_levels": 1, "num_layers": 3, "num_points": [6], "dim_feedforward": 512}]