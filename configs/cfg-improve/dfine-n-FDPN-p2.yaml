backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16

encoder:
  - [1, ConvNormLayer_fuse, [128, 1, 1]] # 4-P2/4
  - [2, ConvNormLayer_fuse, [128, 1, 1]] # 5-P3/8
  - [3, ConvNormLayer_fuse, [128, 1, 1]] # 6-P4/16

  - [-1, TransformerEncoderBlock, [8, 512, 0.1, "relu", 10000, False]] # 7-P4/16

  - [[7, 5, 4], BDBlock, [[3, 5, 7, 9]]] # 8-P3/8
  - [-1, ConvNormLayer_fuse, [128, 3, 2]] # 9-P4/16
  # - [8, nn.Upsample, [None, 2, "nearest"]] # 10-P2/4

  - [[9, 7], Concat, []] # 11-P4/16  (修正：都是P4/16尺寸)
  # - [-1, Faster_Block, [128, 8, 1.5, 0.05, 0.0, 'split_cat']] # 12-P4/16
  - [-1, PartialConv, [128]] # 12-P4/16

decoder:
  - [[8,11], DFINETransformer, {"feat_strides":[8, 16], "hidden_dim": 128, "num_levels": 2, "num_layers": 3, "num_points": [6, 6], "dim_feedforward": 512}]
